<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Student Form</title></head>
<body>
<h2>Student Details Form</h2>
<form>
<fieldset><legend>Personal Details</legend>
<label for="name">Name:</label><input id="name" type="text"><br><br>
<label for="email">Email:</label><input id="email" type="email"><br><br>
<label>Gender:</label><input type="radio" name="g"> Male <input type="radio" name="g"> Female<br><br>
<label>Hobbies:</label><input type="checkbox"> Reading <input type="checkbox"> Sports <input type="checkbox"> Music<br><br>
<label for="dob">Date of Birth:</label><input id="dob" type="date"><br><br>
<label for="color">Favourite Colour:</label><input id="color" type="color"><br><br>
<label for="file">Upload Photo:</label><input id="file" type="file">
</fieldset>
</form>
</body>
</html>
