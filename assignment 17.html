<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Form Validation</title></head>
<body>
<h2>Registration Form - With Validation</h2>
<form method="post" action="submit.php">
<label>Full Name:</label><br><input type="text" placeholder="Full name" required><br><br>
<label>Email:</label><br><input type="email" placeholder="you@college.edu" required><br><br>
<label>Mobile (10 digits):</label><br><input type="tel" placeholder="10-digit mobile" pattern="[0-9]{10}" title="Enter exactly 10 digits" required><br><br>
<label>Password (Min 6 chars):</label><br><input type="password" placeholder="Min 6 characters" minlength="6" required><br><br>
<label>Age (17-30):</label><br><input type="number" placeholder="Age" min="17" max="30" required><br><br>
<button type="submit">Register</button>
</form>
</body>
</html>
