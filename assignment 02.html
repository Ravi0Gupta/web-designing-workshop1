<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Headings & Formatting</title></head>
<body>
<h1>Main Heading</h1>
<h2>Sub Heading</h2>
<h3>Smaller Heading</h3>
<p>This is a <b>bold</b>, <i>italic</i>, <u>underlined</u> and <mark>highlighted</mark> text.</p>
<p>Water formula: H<sub>2</sub>O and Square: x<sup>2</sup></p>
<p>Special Characters: &copy; &reg; &trade; &lt;tag&gt; &amp; &euro; &hearts;</p>
<hr>
<p>First line<br>Second line</p>
</body>
</html>
