<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Block and Inline</title>
<style>div{background:lightblue;margin:5px;padding:5px} span{background:lightgreen;padding:2px}</style>
</head>
<body>
<h2>Block Elements - take full width, start on new line</h2>
<div>Block Div 1</div>
<div>Block Div 2</div>
<p>This is a block paragraph.</p>
<h2>Inline Elements - stay in same line</h2>
<span>Inline 1</span> <span>Inline 2</span> <span>Inline 3</span>
<p>This is <b>bold</b> and <i>italic</i> inside a paragraph.</p>
</body>
</html>
