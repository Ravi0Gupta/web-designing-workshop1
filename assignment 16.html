<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Select and Buttons</title></head>
<body>
<h2>Course Selection</h2>
<form>
<label for="course">Select Course:</label>
<select id="course"><option>BCA</option><option>BBA</option><option>B.Com</option><option>BA</option></select><br><br>
<label for="address">Address:</label><br>
<textarea id="address" rows="4" cols="30" placeholder="Enter your full address"></textarea><br><br>
<button type="submit">Submit</button>
<button type="reset">Reset</button>
<button type="button">Cancel</button>
</form>
</body>
</html>
