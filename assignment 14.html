<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Nested Table</title>
<style>div{overflow-x:auto} table{border-collapse:collapse}</style>
</head>
<body>
<h2>Nested and Responsive Table</h2>
<div>
<table border="1" cellpadding="8">
<tr><th>Day</th><th>Lab Batches</th><th>Faculty</th><th>Room</th><th>Time</th><th>Notes</th></tr>
<tr><td>Friday</td><td>
<table border="1" cellpadding="5"><tr><th>Batch</th><th>Systems</th></tr>
<tr><td>A1</td><td>PC 1-20</td></tr><tr><td>A2</td><td>PC 21-40</td></tr></table>
</td><td>Dr. Sharma</td><td>Lab 2</td><td>2-4 PM</td><td>Carry ID Card</td></tr>
</table>
</div>
<p>Outer table scrolls on small screen. Inner table is nested inside a cell.</p>
</body>
</html>
